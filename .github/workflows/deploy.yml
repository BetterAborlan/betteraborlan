name: Deploy Previews

# Both PRs and pushes to `develop` deploy as a standard Vercel Preview.
#
# On a push to `develop` (not PRs), semantic-release also runs first in
# prerelease mode (branches config in .releaserc.json — "develop" is a
# prerelease channel of "main"), bumping package.json to something like
# 0.3.1-develop.1 and tagging/releasing it as a GitHub prerelease. This
# keeps develop's version meaningful on its own instead of silently
# drifting from main's after every production release. The commit it
# pushes back includes "[skip ci]", so it doesn't retrigger this workflow.
#
# The dev site lives at a fixed alias — https://betteraborlan-dev.vercel.app
# — that this workflow re-points to the fresh deployment on every push to
# `develop`. This is NOT Vercel's automatic "-git-<branch>-" alias: that one
# is only maintained by Vercel's own git-integration-triggered builds, which
# we disabled (Ignored Build Step) so only this workflow's CLI-driven
# deploys run. A CLI deploy from a checked-out repo doesn't carry the git
# metadata needed for Vercel to update that alias on its own, so we set our
# own fixed alias explicitly instead.
#
# Production deploys happen in release.yml, gated behind semantic-release
# on `main`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prerelease (version, changelog, tag, GitHub prerelease)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Install Vercel CLI
        run: npm install -g vercel@58.4.4

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (preview)
        id: deploy-preview
        # Without --archive=tgz, the CLI uploads every build output file as
        # its own request and blows through Vercel's free-plan per-file
        # upload quota ("Too many requests ... code: api-upload-free"),
        # surfacing as an opaque "Upload aborted". Bundling into one tgz
        # upload avoids that entirely. Retry loop stays as a safety net for
        # genuine transient network blips.
        run: |
          for i in 1 2 3; do
            url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}) && break
            echo "Deploy attempt $i failed, retrying in 15s..."
            sleep 15
            if [ "$i" = "3" ]; then
              echo "::error::Deploy failed after 3 attempts"
              exit 1
            fi
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias to fixed dev URL
        if: github.event_name == 'push'
        run: vercel alias set ${{ steps.deploy-preview.outputs.url }} betteraborlan-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${{ steps.deploy-preview.outputs.url }}`
            });
